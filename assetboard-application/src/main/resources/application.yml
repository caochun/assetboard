server:
  port: 8080

spring:
  application:
    name: assetboard
  datasource:
    url: jdbc:h2:file:./data/assetboard;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:sql/schema-entities.sql
        - classpath:sql/schema-ts.sql

security:
  jwt:
    secret: assetboard-secret-key-must-be-at-least-256-bits-long!!
    expiration-ms: 86400000

assetboard:
  tenant-id: 00000000-0000-0000-0000-000000000001

collector:
  schedule:
    ship-track: "-"
    ship-psc: "-"
    nav-warning: "-"
    weather: "-"
    ship-alert: "-"
    valuation: "-"
  shipxy:
    api-prefix: ${SHIPXY_API_PREFIX:https://api.shipxy.com/apicall}
    api-key: ${SHIPXY_API_KEY:}
    user-id: ${SHIPXY_USER_ID:}
  clarksons:
    api-url: ${CLARKSONS_API_URL:https://www.clarksons.net.cn/api}
    username: ${CLARKSONS_USERNAME:}
    password: ${CLARKSONS_PASSWORD:}
